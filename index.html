<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EARTH ONE - 全球数字宇宙</title>
    <meta name="description" content="EARTH ONE - 全球数字宇宙。三维真实地球、全球公版数字图书馆、太阳系宇宙引擎与多模型人工智能生态。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta property="og:title" content="EARTH ONE - 全球数字宇宙" />
    <meta property="og:description" content="EARTH ONE - 全球数字宇宙。三维真实地球、全球公版数字图书馆、太阳系宇宙引擎与多模型人工智能生态。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts for internationalized typography (Chinese, English, Arabic, Russian, French, Spanish) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-slate-100 overflow-x-hidden antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <!-- ================= 赛博机能风开机引导层 START ================= -->
    <div id="boot-splash" class="boot-overlay">
      <!-- 科技网格与扫描线背景 -->
      <div class="boot-grid"></div>
      <div class="boot-stars"></div>
      <div class="boot-scanline"></div>
      <div class="boot-scan-sweep"></div>

      <!-- 四角 HUD 机能装饰 -->
      <div class="boot-hud boot-hud-tl">SYS.VER // 2.0.26<br><span>STATUS: ONLINE</span></div>
      <div class="boot-hud boot-hud-tr">
        <button id="boot-skip" class="boot-skip-btn" type="button" aria-label="Skip startup animation">[ SKIP // 跳过 ]</button>
      </div>
      <div class="boot-hud boot-hud-bl">COORD // 31.9539° N, 35.9106° E<br><span id="boot-random-num">00.491.882</span></div>
      <div class="boot-hud boot-hud-br">STARTUP_SEQUENCE // READY</div>

      <!-- 阶段1：中央 Logo 闪现 -->
      <div id="boot-stage-logo" class="boot-center-box boot-hidden">
        <div class="boot-logo-ring">
          <div class="boot-logo-icon">◈</div>
        </div>
        <div class="boot-logo-text boot-glitch" data-text="EARTH ONE // UNIVERSE SYSTEM">EARTH ONE // UNIVERSE SYSTEM</div>
        <div class="boot-logo-sub">GLOBAL DIGITAL UNIVERSE</div>
      </div>

      <!-- 阶段2：核心 HUD 与线框视觉界面 -->
      <div id="boot-stage-main" class="boot-main-container boot-hidden">
        <!-- 左侧终端信息区 -->
        <div class="boot-left-panel">
          <div class="boot-tag">EARTH ONE // TERMINAL</div>
          <h1 class="boot-title" data-text="EARTH ONE">EARTH ONE</h1>
          <p class="boot-subtitle">—— 一个宇宙 · 一个世界 · 一个人类 ——</p>

          <div class="boot-status-box">
            <div class="boot-status-cn" id="boot-text-cn" role="status" aria-live="polite">正在接入数字宇宙...</div>
            <div class="boot-status-en" id="boot-text-en">CONNECTING UNIVERSE ENGINE</div>
            <div class="boot-progress-track" id="boot-progress" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="boot-progress-bar" id="boot-bar"></div>
            </div>
          </div>
        </div>

        <!-- 右侧视觉渲染区（CSS 模拟线框到实景过渡） -->
        <div class="boot-right-visual">
          <div class="boot-visual-card" id="boot-visual-img"></div>
        </div>
      </div>
    </div>

    <style>
      .boot-overlay {
        position: fixed; inset: 0; z-index: 99999;
        background: radial-gradient(circle at 70% 50%, #0a192f 0%, #02060d 75%);
        color: #e2f1ff; font-family: 'SF Pro Display', 'PingFang SC', Consolas, monospace;
        overflow: hidden; user-select: none;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), filter 0.35s ease;
      }
      .boot-overlay.boot-fadeout {
        opacity: 0; filter: brightness(2) contrast(2); pointer-events: none;
      }
      .boot-grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px; pointer-events: none;
      }
      .boot-scanline {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 229, 255, 0.03) 51%);
        background-size: 100% 4px; pointer-events: none;
      }
      .boot-stars {
        position: absolute; inset: 0; pointer-events: none;
        background-image:
          radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.7), transparent),
          radial-gradient(1px 1px at 62% 72%, rgba(0,229,255,0.6), transparent),
          radial-gradient(2px 2px at 82% 18%, rgba(255,255,255,0.5), transparent),
          radial-gradient(1px 1px at 40% 84%, rgba(0,229,255,0.5), transparent),
          radial-gradient(1.5px 1.5px at 10% 60%, rgba(255,255,255,0.45), transparent),
          radial-gradient(1px 1px at 90% 52%, rgba(0,229,255,0.55), transparent),
          radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.4), transparent),
          radial-gradient(1.5px 1.5px at 30% 10%, rgba(0,229,255,0.5), transparent),
          radial-gradient(1px 1px at 55% 55%, rgba(255,255,255,0.35), transparent),
          radial-gradient(2px 2px at 15% 88%, rgba(0,229,255,0.4), transparent);
        animation: bootTwinkle 3.2s ease-in-out infinite;
      }
      @keyframes bootTwinkle {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      .boot-hud {
        position: absolute; font-size: 11px; letter-spacing: 2px;
        color: rgba(0, 229, 255, 0.55); line-height: 1.6;
      }
      .boot-hud-tl { top: 28px; left: 36px; border-left: 2px solid #00e5ff; padding-left: 10px; }
      .boot-hud-tr { top: 28px; right: 36px; z-index: 10; }
      .boot-hud-bl { bottom: 28px; left: 36px; }
      .boot-hud-br { bottom: 28px; right: 36px; border-right: 2px solid #00e5ff; padding-right: 10px; }
      .boot-skip-btn {
        background: rgba(0, 229, 255, 0.08); border: 1px solid rgba(0, 229, 255, 0.35);
        color: #00e5ff; min-width: 44px; min-height: 44px; padding: 8px 14px; font-size: 11px; letter-spacing: 1.5px;
        cursor: pointer; transition: all 0.25s;
      }
      .boot-skip-btn:hover { background: #00e5ff; color: #02060d; box-shadow: 0 0 12px #00e5ff; }
      .boot-skip-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      .boot-center-box {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; transition: opacity 0.4s ease;
      }
      .boot-hidden { opacity: 0; pointer-events: none; }
      .boot-logo-icon { font-size: 48px; color: #00e5ff; text-shadow: 0 0 20px #00e5ff; animation: bootPulse 1.2s infinite; }
      .boot-logo-text { font-size: 22px; font-weight: 700; letter-spacing: 6px; margin-top: 12px; }
      .boot-logo-sub { font-size: 10px; letter-spacing: 4px; color: #00e5ff; margin-top: 6px; opacity: 0.7; }

      .boot-main-container {
        position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: space-between; padding: 0 10%; transition: opacity 0.5s ease;
      }
      .boot-left-panel { z-index: 2; max-width: 480px; }
      .boot-tag { font-size: 11px; color: #00e5ff; letter-spacing: 3px; margin-bottom: 8px; opacity: 0.8; }
      .boot-title {
        font-size: 56px; font-weight: 800; margin: 0; letter-spacing: 4px;
        background: linear-gradient(90deg, #ffffff, #7ce8ff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        text-shadow: 0 0 35px rgba(0, 229, 255, 0.35);
      }
      .boot-subtitle { font-size: 13px; letter-spacing: 4px; color: #8ab4f8; margin: 12px 0 42px 0; }
      .boot-status-box {
        border-left: 3px solid #00e5ff; padding-left: 18px;
        background: linear-gradient(90deg, rgba(0, 229, 255, 0.07), transparent);
        padding-top: 10px; padding-bottom: 10px;
      }
      .boot-status-cn { font-size: 18px; font-weight: 600; letter-spacing: 3px; color: #fff; }
      .boot-status-en { font-size: 11px; letter-spacing: 2.5px; color: #00e5ff; margin-top: 4px; }
      .boot-progress-track {
        width: 260px; height: 2px; background: rgba(255,255,255,0.12); margin-top: 14px; overflow: hidden;
      }
      .boot-progress-bar {
        width: 0%; height: 100%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff;
        transition: width 0.6s ease;
      }
      /* 右侧视觉特效：模拟从发光线框过渡到实景 */
      .boot-right-visual {
        position: relative; width: 45%; height: 75%; display: flex; align-items: center; justify-content: center;
      }
      .boot-visual-card {
        width: 100%; height: 100%;
        background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1600&auto=format&fit=crop');
        background-size: cover; background-position: center;
        border-radius: 4px;
        /* 初始状态：高对比度科技线框感 */
        filter: grayscale(100%) contrast(300%) invert(100%) sepia(100%) hue-rotate(155deg) brightness(0.9);
        mix-blend-mode: screen; opacity: 0.4;
        transition: filter 2.2s ease, opacity 1.5s ease, transform 3s ease;
      }
      .boot-visual-card.boot-rendered {
        /* 激活状态：平滑还原为高清实景色彩，并缓慢 Ken Burns 漂移 */
        filter: grayscale(0%) contrast(115%) invert(0%) sepia(0%) hue-rotate(0deg) brightness(1);
        opacity: 0.9;
        animation: bootDrift 16s ease-in-out infinite alternate;
      }
      @keyframes bootDrift {
        from { transform: scale(1.03) translate(0, 0); }
        to { transform: scale(1.13) translate(-1.5%, -1.5%); }
      }
      @keyframes bootPulse { 0%, 100% { opacity: 0.4; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
      @media (max-width: 768px) {
        .boot-main-container { flex-direction: column; justify-content: center; text-align: center; }
        .boot-right-visual { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.25; }
        .boot-status-box { border-left: none; border-top: 2px solid #00e5ff; padding-left: 0; }
        .boot-progress-track { margin: 14px auto 0; }
      }
      @media (max-width: 480px) {
        .boot-hud { font-size: 9px; letter-spacing: 1px; }
        .boot-hud-tl { top: 14px; left: 14px; }
        .boot-hud-tr { top: 14px; right: 14px; }
        .boot-hud-bl { bottom: 14px; left: 14px; }
        .boot-hud-br { bottom: 14px; right: 14px; }
        .boot-title { font-size: clamp(2rem, 11vw, 3rem); letter-spacing: 2px; }
        .boot-subtitle { font-size: 11px; letter-spacing: 1px; margin-bottom: 24px; }
        .boot-logo-text { font-size: clamp(14px, 4vw, 22px); letter-spacing: 2px; }
        .boot-skip-btn { padding: 8px 10px; font-size: 10px; }
      }

      /* ============ 未来感增强层 ============ */
      .boot-overlay::before {
        content: '';
        position: absolute; inset: -60%;
        background: conic-gradient(from 0deg,
          transparent 0deg, rgba(0,229,255,0.09) 40deg, transparent 90deg,
          rgba(168,85,247,0.08) 170deg, transparent 210deg,
          rgba(0,229,255,0.09) 290deg, transparent 360deg);
        animation: bootAurora 22s linear infinite;
        pointer-events: none;
      }
      @keyframes bootAurora { to { transform: rotate(360deg); } }
      .boot-scan-sweep {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background: linear-gradient(to bottom, transparent 0%, rgba(0,229,255,0.06) 48%, rgba(124,232,255,0.14) 50%, rgba(0,229,255,0.06) 52%, transparent 100%);
        background-size: 100% 220px; background-repeat: no-repeat;
        animation: bootSweep 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes bootSweep {
        0% { background-position: 0 -220px; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { background-position: 0 110%; opacity: 0; }
      }
      .boot-particle {
        position: absolute; width: 2px; height: 2px; border-radius: 9999px;
        background: #7ce8ff; box-shadow: 0 0 10px #00e5ff, 0 0 20px rgba(0,229,255,0.6);
        pointer-events: none; will-change: transform, opacity;
        animation-name: bootFloat; animation-timing-function: linear; animation-iteration-count: infinite;
      }
      @keyframes bootFloat {
        0% { transform: translate3d(0, 0, 0); opacity: 0; }
        12% { opacity: 0.9; }
        88% { opacity: 0.9; }
        100% { transform: translate3d(24px, -58vh, 0); opacity: 0; }
      }
      .boot-logo-ring { position: relative; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; }
      .boot-logo-ring::before {
        content: ''; position: absolute; inset: 0; border-radius: 9999px;
        border: 1px solid rgba(0,229,255,0.3); border-top-color: #00e5ff;
        animation: bootRingSpin 2.6s linear infinite;
        box-shadow: 0 0 40px rgba(0,229,255,0.25), inset 0 0 40px rgba(0,229,255,0.1);
      }
      .boot-logo-ring::after {
        content: ''; position: absolute; inset: 16px; border-radius: 9999px;
        border: 1px dashed rgba(168,85,247,0.45);
        animation: bootRingSpin 4.5s linear infinite reverse;
      }
      @keyframes bootRingSpin { to { transform: rotate(360deg); } }
      .boot-glitch { position: relative; }
      .boot-glitch::before, .boot-glitch::after {
        content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; pointer-events: none;
      }
      .boot-glitch::before { color: #0ff; text-shadow: -1px 0 #0ff; transform: translate(-2px, 0); animation: bootGlitchA 3s infinite linear alternate-reverse; }
      .boot-glitch::after { color: #f0f; text-shadow: 1px 0 #f0f; transform: translate(2px, 0); animation: bootGlitchB 2.6s infinite linear alternate-reverse; }
      @keyframes bootGlitchA {
        0% { clip-path: inset(0 0 78% 0); opacity: 0.5; }
        20% { clip-path: inset(12% 0 42% 0); opacity: 0.85; }
        40% { clip-path: inset(55% 0 18% 0); opacity: 0.5; }
        60% { clip-path: inset(28% 0 62% 0); opacity: 0.75; }
        80% { clip-path: inset(0 0 85% 0); opacity: 0.4; }
        100% { clip-path: inset(68% 0 8% 0); opacity: 0.6; }
      }
      @keyframes bootGlitchB {
        0% { clip-path: inset(62% 0 0 0); opacity: 0.5; }
        25% { clip-path: inset(18% 0 60% 0); opacity: 0.75; }
        50% { clip-path: inset(80% 0 4% 0); opacity: 0.5; }
        75% { clip-path: inset(42% 0 32% 0); opacity: 0.85; }
        100% { clip-path: inset(8% 0 72% 0); opacity: 0.6; }
      }
      .boot-status-cn::after {
        content: '▌'; color: #00e5ff; margin-left: 3px; animation: bootBlink 0.75s step-end infinite; text-shadow: 0 0 10px #00e5ff;
      }
      @keyframes bootBlink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-overlay,
        .boot-overlay *,
        .boot-overlay::before,
        .boot-overlay::after {
          animation: none !important;
          transition: none !important;
        }
        .boot-scanline,
        .boot-scan-sweep,
        .boot-stars,
        .boot-particle,
        .boot-overlay::before { display: none !important; }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function() {
        const splash = document.getElementById('boot-splash');
        const stageLogo = document.getElementById('boot-stage-logo');
        const stageMain = document.getElementById('boot-stage-main');
        const textCn = document.getElementById('boot-text-cn');
        const textEn = document.getElementById('boot-text-en');
        const bar = document.getElementById('boot-bar');
        const progress = document.getElementById('boot-progress');
        const visualImg = document.getElementById('boot-visual-img');
        const skipButton = document.getElementById('boot-skip');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let finished = false;
        let numTimer;
        const timers = new Set();

        function schedule(callback, delay) {
          const timer = setTimeout(() => {
            timers.delete(timer);
            if (!finished) callback();
          }, delay);
          timers.add(timer);
        }

        function finishBoot(immediate = false) {
          if (finished) return;
          finished = true;
          clearInterval(numTimer);
          timers.forEach(clearTimeout);
          document.removeEventListener('keydown', onKeydown);
          if (immediate) {
            splash.remove();
            return;
          }
          splash.classList.add('boot-fadeout');
          setTimeout(() => splash.remove(), 400);
        }

        function onKeydown(event) {
          if (event.key === 'Escape') finishBoot();
        }

        skipButton.addEventListener('click', () => finishBoot());
        document.addEventListener('keydown', onKeydown);

        if (reducedMotion) {
          finishBoot(true);
          return;
        }

        // 随机坐标数字跳动
        numTimer = setInterval(() => {
          const el = document.getElementById('boot-random-num');
          if (el) el.innerText = (Math.random() * 99).toFixed(3) + '.' + Math.floor(100 + Math.random() * 899);
        }, 500);

        // 漂浮粒子场
        (function spawnParticles() {
          const container = document.getElementById('boot-splash');
          if (!container || window.matchMedia('(max-width: 768px)').matches) return;
          for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'boot-particle';
            p.style.left = (Math.random() * 100) + '%';
            p.style.bottom = '-4px';
            p.style.animationDuration = (6 + Math.random() * 8) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            container.appendChild(p);
          }
        })();

        const steps = [
          { cn: '正在接入数字宇宙...', en: 'CONNECTING UNIVERSE ENGINE', progress: '60%' },
          { cn: '系统就绪 · 欢迎来到 EARTH ONE', en: 'EARTH ONE // READY', progress: '100%' }
        ];

        function runStep(index) {
          const step = steps[index];
          textCn.textContent = step.cn;
          textEn.textContent = step.en;
          bar.style.width = step.progress;
          progress.setAttribute('aria-valuenow', step.progress.replace('%', ''));
          if (index < steps.length - 1) {
            schedule(() => runStep(index + 1), 300);
          } else {
            textCn.style.color = '#00e5ff';
            textCn.style.textShadow = '0 0 18px #00e5ff';
            schedule(() => finishBoot(), 300);
          }
        }

        stageLogo.classList.remove('boot-hidden');
        schedule(() => {
          stageLogo.classList.add('boot-hidden');
          stageMain.classList.remove('boot-hidden');
          visualImg.classList.add('boot-rendered');
          runStep(0);
        }, 400);
      })();
    </script>
    <!-- ================= 赛博机能风开机引导层 END ================= -->
  </body>
</html>
