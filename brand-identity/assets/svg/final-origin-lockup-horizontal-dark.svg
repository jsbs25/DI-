      <circle cx="0" cy="0" r="86" fill="none" stroke="#F4F1EA" stroke-width="10" opacity="0.28"/>
      <circle fill="#2F6F5E" cx="0" cy="0" r="34"/>
      <circle fill="#F4F1EA" cx="0" cy="0" r="10"/>
    </g>
