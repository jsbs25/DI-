<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">独一 ONE - Final Horizontal Lockup (Dark)</title>
  <desc id="desc">Optimized ONE ORIGIN symbol with Chinese and English wordmark, horizontal layout for dark backgrounds.</desc>
  <defs>
    <style>
      .bg{fill:#0B0D10}
      .cn{font: 600 118px 'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; fill:#F4F1EA; letter-spacing:6px}
      .en{font: 600 96px 'Montserrat','Inter','Helvetica Neue',Arial,sans-serif; fill:#A7ADB4; letter-spacing:10px}
    </style>
  </defs>
  <rect class="bg" width="1200" height="400"/>
  <g transform="translate(200 200) scale(0.78) translate(-256 -256)">
    <g transform="translate(256 256)">
